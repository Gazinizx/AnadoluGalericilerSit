name: Build iOS and Android Applications

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnadoluGaleri-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Build iOS Xcode App
        run: |
          mkdir -p iosBuild
          zip -r iosBuild/AnadoluGaleri-iOS-App.zip iosApp
        continue-on-error: true

      - name: Upload iOS Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnadoluGaleri-iOS-Package
          path: iosBuild/AnadoluGaleri-iOS-App.zip
